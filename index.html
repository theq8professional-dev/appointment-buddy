<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>My Appointments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF3E4;
    --cream-deep: #F3E7D0;
    --honey: #E8A33D;
    --honey-deep: #C97F1E;
    --teal: #1F6F6B;
    --teal-deep: #14514E;
    --plum: #6B4C6B;
    --ink: #3A2E22;
    --ink-soft: #6B5D4C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(1200px 800px at 50% -10%, var(--cream-deep), var(--cream) 60%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 20px 60px;
    overflow-x:hidden;
  }
  .prompt{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: clamp(22px, 5vw, 30px);
    text-align:center;
    margin: 8px 0 6px;
    color: var(--ink);
  }
  .subprompt{
    font-size:16px;
    color:var(--ink-soft);
    text-align:center;
    max-width:340px;
    margin-bottom:28px;
    line-height:1.4;
  }

  /* --- The Big Button --- */
  .stage{
    position:relative;
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border:2px solid var(--honey);
    opacity:0;
  }
  .mic-btn{
    position:relative;
    width:180px;
    height:180px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #F6C066, var(--honey) 55%, var(--honey-deep) 100%);
    box-shadow: 0 12px 30px rgba(201,127,30,0.35), inset 0 -6px 14px rgba(0,0,0,0.15), inset 0 6px 10px rgba(255,255,255,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .12s ease;
    animation: breathe 3.4s ease-in-out infinite;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .mic-btn:active, .mic-btn.listening{ transform: scale(0.94); }
  .mic-btn.listening{
    background: radial-gradient(circle at 35% 30%, #ff9f6e, var(--teal) 60%, var(--teal-deep) 100%);
    animation: none;
    box-shadow: 0 0 0 0 rgba(31,111,107,0.5);
  }
  .mic-btn.thinking{
    background: radial-gradient(circle at 35% 30%, #cbb7d9, var(--plum) 60%, #4d374d 100%);
    animation: spin-glow 1.1s linear infinite;
  }
  @keyframes breathe{
    0%,100%{ box-shadow: 0 12px 30px rgba(201,127,30,0.35), inset 0 -6px 14px rgba(0,0,0,0.15), inset 0 6px 10px rgba(255,255,255,0.35);}
    50%{ box-shadow: 0 18px 40px rgba(201,127,30,0.5), inset 0 -6px 14px rgba(0,0,0,0.15), inset 0 6px 10px rgba(255,255,255,0.45);}
  }
  @keyframes spin-glow{
    0%{ filter:brightness(1);}
    50%{ filter:brightness(1.25);}
    100%{ filter:brightness(1);}
  }
  .mic-btn svg{ width:70px; height:70px; }
  .ring.animate{
    animation: ripple 1.4s ease-out infinite;
  }
  @keyframes ripple{
    0%{ width:180px; height:180px; opacity:0.55; }
    100%{ width:280px; height:280px; opacity:0; }
  }
  .hint{
    font-size:14px;
    color: var(--ink-soft);
    font-weight:700;
    letter-spacing:.2px;
    min-height:20px;
    max-width: 320px;
    text-align: center;
    line-height:1.4;
    margin-bottom: 30px;
  }

  /* --- Confirm card --- */
  /* --- Save toast (replaces the old confirm screen — instant save, brief undo window) --- */
  .toast{
    position:fixed;
    left:16px; right:16px; bottom:24px;
    max-width:420px;
    margin:0 auto;
    background:var(--teal-deep);
    color:white;
    border-radius:18px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    transform: translateY(120%);
    opacity:0;
    transition: transform .3s ease, opacity .3s ease;
    z-index:60;
  }
  .toast.show{ transform: translateY(0); opacity:1; }
  .toast-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; }
  .toast-sub{ font-size:13px; opacity:0.85; margin-top:2px; }
  .toast button{
    flex-shrink:0;
    background:rgba(255,255,255,0.15);
    color:white;
    border:2px solid rgba(255,255,255,0.4);
    border-radius:12px;
    padding:8px 14px;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }

  /* --- List --- */
  .list{ width:100%; max-width:460px; display:flex; flex-direction:column; gap:14px; }
  .card{
    background:white;
    border-radius:22px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    box-shadow:0 6px 18px rgba(58,46,34,0.08);
    user-select:none;
    cursor:pointer;
    transition: transform .12s ease, opacity .35s ease;
    border-left: 6px solid var(--teal);
  }
  .card.tap1{ transform:scale(.985); }
  .card.tap2{ transform:scale(.965); filter:saturate(1.4); }
  .card.gone{ transform:scale(.3) rotate(8deg); opacity:0; }
  .card-doc{ font-family:'Fredoka',sans-serif; font-size:18px; font-weight:600; }
  .card-sub{ font-size:14px; color:var(--ink-soft); margin-top:2px; }
  .card-when{ text-align:right; }
  .card-date{ font-weight:800; color:var(--teal-deep); font-size:15px; }
  .card-time{ font-size:14px; color:var(--ink-soft); }
  .empty{ color:var(--ink-soft); text-align:center; font-size:15px; margin-top:10px; max-width:280px; }
  .unsupported{ max-width:340px; text-align:center; color:var(--ink-soft); font-size:15px; line-height:1.5; }
</style>
</head>
<body>

  <div class="prompt">When's your next appointment?</div>
  <div class="subprompt">Press and hold the button, then just talk. Let go when you're done.</div>

  <div class="stage">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <button class="mic-btn" id="micBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg">No appointments yet. Press the button above whenever you book one.</div>

  <div class="toast" id="toast"></div>

<script>
// ---------- Audio chimes (no external files) ----------
let actx;
function tone(freq, duration, type='sine', startGain=0.14){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(startGain, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + duration);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + duration);
  }catch(e){}
}
function chimeStart(){ tone(660,0.14,'sine',0.13); setTimeout(()=>tone(880,0.16,'sine',0.13),90); }
function chimeStop(){ tone(520,0.12,'sine',0.12); setTimeout(()=>tone(390,0.18,'sine',0.1),70); }
function chimeSuccess(){ tone(523,0.12); setTimeout(()=>tone(659,0.12),100); setTimeout(()=>tone(784,0.22),200); }
function chimePoof(){ tone(700,0.08,'triangle',0.1); setTimeout(()=>tone(300,0.16,'triangle',0.08),60); }

// ---------- Elements ----------
const micBtn = document.getElementById('micBtn');
const hint = document.getElementById('hint');
const listEl = document.getElementById('list');
const emptyMsg = document.getElementById('emptyMsg');
const toast = document.getElementById('toast');
const r1 = document.querySelector('.r1');
const r2 = document.querySelector('.r2');

let appointments = [];

// ---------- Storage ----------
const STORAGE_KEY = 'appointments-list';
async function loadAppointments(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    appointments = res ? JSON.parse(res.value) : [];
  }catch(e){ appointments = []; }
  render();
}
async function saveAppointments(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(appointments), false); }catch(e){}
}

// ---------- Speech recognition ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let finalTranscript = '';
let latestInterim = '';
let sessionId = 0;
let sessionActive = false;  // true from pointerdown until we've resolved (processed or reset)
let watchdogTimer = null;

// Ask for mic permission up front, on page load, so it never interrupts a hold gesture later.
async function primeMicPermission(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  }catch(e){ /* if denied, we'll surface it clearly the moment they try to record */ }
}
if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){ primeMicPermission(); }

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalTranscript += t + ' ';
      else interim += t;
    }
    if(interim) latestInterim = interim;
  };
  recognition.onerror = (e) => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      finishSession("Mic access is blocked — allow it in Chrome's site settings", true);
    } else if(e.error === 'no-speech'){
      finishSession('', false);
    } else if(e.error === 'aborted'){
      // We caused this ourselves (abort/reset) — no user-facing message needed.
    } else if(e.error === 'network'){
      finishSession("No connection — check your signal and try again", true);
    } else {
      finishSession("Something glitched — try again", true);
    }
  };
  recognition.onend = () => {
    if(sessionActive) finishSession('', false);
  };
} else {
  document.querySelector('.stage').outerHTML = '<div class="unsupported">Voice isn\'t supported in this browser yet. Try opening this in Chrome.</div>';
  hint.textContent = '';
}

function startListeningUI(){
  micBtn.classList.add('listening');
  r1.classList.add('animate'); r2.classList.add('animate');
  r2.style.animationDelay = '0.5s';
  hint.textContent = "Listening… I'm all ears";
}
function stopListeningUI(){
  micBtn.classList.remove('listening');
  r1.classList.remove('animate'); r2.classList.remove('animate');
}

// Single exit point for a recording session — guarantees the UI can never stay stuck.
function finishSession(errorMessage, isError){
  clearTimeout(watchdogTimer);
  sessionActive = false;
  stopListeningUI();
  if(errorMessage){
    hint.textContent = errorMessage;
    return;
  }
  const text = (finalTranscript || latestInterim).trim();
  if(!text){
    hint.textContent = "Didn't catch that — try again";
    return;
  }
  processTranscript(text);
}

function startRecording(e){
  e.preventDefault();
  if(!recognition) return;
  try{ micBtn.setPointerCapture(e.pointerId); }catch(err){}

  // If a previous session somehow never resolved, forcibly clear it before starting fresh.
  if(sessionActive){
    try{ recognition.abort(); }catch(err){}
    clearTimeout(watchdogTimer);
  }

  finalTranscript = '';
  latestInterim = '';
  sessionActive = true;
  sessionId++;
  const thisSession = sessionId;

  chimeStart();
  startListeningUI();
  try{ recognition.start(); }catch(err){}

  // Hard failsafe: no matter what the browser does, this session ends within 30s.
  watchdogTimer = setTimeout(() => {
    if(sessionActive && sessionId === thisSession){
      try{ recognition.abort(); }catch(err){}
      finishSession('', false);
    }
  }, 30000);
}
function stopRecording(e){
  if(e) e.preventDefault();
  if(!recognition || !sessionActive) return;
  chimeStop();
  hint.textContent = 'Got it — one sec…';
  try{ recognition.stop(); }catch(err){ finishSession('', false); }

  // Failsafe: if the browser never fires onend/onerror after stop(), resolve anyway.
  const thisSession = sessionId;
  setTimeout(() => {
    if(sessionActive && sessionId === thisSession){
      try{ recognition.abort(); }catch(err){}
      finishSession('', false);
    }
  }, 1500);
}

micBtn.addEventListener('pointerdown', startRecording);
micBtn.addEventListener('pointerup', stopRecording);
micBtn.addEventListener('pointercancel', stopRecording);
micBtn.addEventListener('contextmenu', (e)=> e.preventDefault());
micBtn.addEventListener('dragstart', (e)=> e.preventDefault());

// ---------- Local fallback parser (works with no server/API at all) ----------
// Used automatically whenever the Claude API call isn't reachable — e.g. when this
// page is hosted standalone (GitHub Pages) instead of inside Claude's own preview,
// which is the only place that proxy call can authenticate.
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const WEEKDAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const SPECIALTIES = ['orthopedic','orthopedist','dentist','dermatologist','cardiologist','nephrologist','urologist',
  'gynecologist','pediatrician','optometrist','ophthalmologist','psychiatrist','therapist','physical therapist',
  'chiropractor','dermatology','oncologist','neurologist','ent','allergist','endocrinologist','podiatrist',
  'eye doctor','general practitioner','primary care','gp','surgeon','diabetes','diabetic','sugar doctor',
  'skin doctor','heart doctor','bone doctor','foot doctor','kidney doctor','stomach doctor','lady doctor',
  'checkup','check-up','physical','dental','vision','ear doctor','lung doctor'];

function localParse(text, todayStr){
  const lower = text.toLowerCase();
  const [ty, tm, td] = todayStr.split('-').map(Number);
  const today = new Date(ty, tm-1, td);
  let date = '';
  let time = '';
  let doctorName = '';
  let specialty = '';

  // --- date: explicit "Month Day[, Year]" wins over everything else ---
  const monthDayRe = new RegExp(`(${MONTHS.join('|')})\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s*(\\d{4}))?`, 'i');
  const md = lower.match(monthDayRe);
  if(md){
    const monthIdx = MONTHS.indexOf(md[1].toLowerCase());
    const day = parseInt(md[2], 10);
    let year = md[3] ? parseInt(md[3], 10) : today.getFullYear();
    if(!md[3]){
      const candidate = new Date(year, monthIdx, day);
      if(candidate < today) year += 1; // no year given -> next upcoming occurrence
    }
    const d = new Date(year, monthIdx, day);
    date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  } else if(/\btomorrow\b/.test(lower)){
    const d = new Date(today); d.setDate(d.getDate()+1);
    date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  } else if(/\btoday\b/.test(lower)){
    date = todayStr;
  } else {
    const wdRe = new RegExp(`(next\\s+(?:week\\s+)?)?(${WEEKDAYS.join('|')})`, 'i');
    const wd = lower.match(wdRe);
    if(wd){
      const targetIdx = WEEKDAYS.indexOf(wd[2].toLowerCase());
      const d = new Date(today);
      let diff = (targetIdx - d.getDay() + 7) % 7;
      if(diff === 0 || wd[1]) diff += 7; // "next" or same-day-name means the upcoming one, not today
      d.setDate(d.getDate() + diff);
      date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
  }

  // --- time ---
  const timeRe = /(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)/i;
  const tmatch = text.match(timeRe);
  if(tmatch){
    let h = parseInt(tmatch[1], 10);
    const min = tmatch[2] || '00';
    const ampm = /p/i.test(tmatch[3]) ? 'PM' : 'AM';
    time = `${h}:${min} ${ampm}`;
  } else if(/\bnoon\b/.test(lower)){
    time = '12:00 PM';
  } else if(/\bmidnight\b/.test(lower)){
    time = '12:00 AM';
  } else {
    const oclockRe = /(\d{1,2})\s*o[' ]?clock/i;
    const om = text.match(oclockRe);
    if(om){
      // No am/pm given — assume daytime (AM for early hours, PM for the rest); easy to correct in the edit field.
      const h = parseInt(om[1], 10);
      const ampm = (h >= 1 && h <= 7) ? 'PM' : 'AM';
      time = `${h}:00 ${ampm}`;
    }
  }

  // --- doctor name: "Dr./Doctor <Name>" or "with <Name>" ---
  const nameRe = /\b(?:dr\.?|doctor)\s+([A-Z][a-zA-Z'-]+(?:\s+[A-Z][a-zA-Z'-]+)?)/;
  const nmatch = text.match(nameRe);
  if(nmatch){
    doctorName = nmatch[1];
  } else {
    const withRe = /\bwith\s+([A-Z][a-zA-Z'-]+(?:\s+[A-Z][a-zA-Z'-]+)?)\b/;
    const wmatch = text.match(withRe);
    if(wmatch && !SPECIALTIES.includes(wmatch[1].toLowerCase())) doctorName = wmatch[1];
  }

  // --- specialty: match against known keyword list ---
  for(const s of SPECIALTIES){
    if(lower.includes(s)){ specialty = s.replace(/\b\w/g, c => c.toUpperCase()); break; }
  }

  return { doctorName, specialty, date, time, location: '', verified: false, verifyNote: '' };
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

// ---------- Claude parsing (with automatic local fallback) ----------
async function processTranscript(text){
  if(!text){ hint.textContent = "I didn't hear anything — try again"; return; }
  micBtn.classList.add('thinking');
  hint.textContent = `Heard: "${text}" — figuring it out…`;

  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  const systemPrompt = `Today's date is ${todayStr}. A person spoke out loud, possibly ramblingly, describing an upcoming appointment (often a doctor's appointment). Extract structured info from what they said, and use web search to do a quick sanity check on whether the named doctor/professional plausibly exists (e.g. search their name plus specialty or "doctor"). Resolve relative dates ("next Tuesday", "June 9th") into an actual date using today's date above.

If the speaker names a weekday together with a specific month and day and the two don't actually match (e.g. "Saturday, August 9th" when August 9th isn't a Saturday), IGNORE the weekday entirely and use the explicit month/day — people misspeak the weekday far more often than the date. Never let a mismatched weekday block or change the date you extract. The same goes for any other small self-contradiction: prefer the most specific, concrete detail (an exact date, an exact time) over a looser or conflicting one, and don't let the conflict stop you from producing a best-guess answer.

If they give a month and day but no year (e.g. "October 9th"), assume the NEXT upcoming occurrence of that date relative to today — if that month/day has already passed this year, use next year; otherwise use this year. Never default to a past date.

The speaker may not mention a doctor's name at all, only a specialty or reason (e.g. "the orthopedic," "my dentist," "eye doctor"). That's completely fine — leave doctorName as an empty string in that case rather than guessing a name, and fill in specialty as best you can from what they said.

Respond with ONLY a raw JSON object, no markdown fences, no citations, no extra text. Shape:
{
  "doctorName": "string, best-guess proper name, or empty string if none mentioned",
  "specialty": "string, e.g. Nephrologist, Dentist, or empty string if unclear",
  "date": "YYYY-MM-DD, best guess, or empty string if unclear",
  "time": "string like '4:30 PM', or empty string if unclear",
  "location": "string, clinic/hospital name if mentioned, else empty string",
  "verified": true or false (true only if web search found a real plausible match for the name+specialty),
  "verifyNote": "very short string, e.g. 'Found a nephrologist by this name nearby' or 'Could not confirm this name'"
}`;

  let parsed = null;
  try{
    const response = await withTimeout(fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: `Here's what they said: "${text}"` }],
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    }), 8000);
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    const clean = textBlocks.replace(/```json|```/g, '').trim();
    const jsonMatch = clean.match(/\{[\s\S]*\}/);
    parsed = JSON.parse(jsonMatch ? jsonMatch[0] : clean);
  }catch(err){
    // No AI proxy available (e.g. hosted standalone) or it timed out — fall back to local parsing.
    parsed = localParse(text, todayStr);
  }
  micBtn.classList.remove('thinking');

  if(!parsed.date){
    hint.textContent = `Heard: "${text}" — but couldn't catch a date. Try again and include one (like "tomorrow" or "Monday").`;
    return;
  }
  await autoSave(parsed, text);
}

function formatDatePretty(iso){
  if(!iso) return 'Date not caught';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}

// Builds a natural label whether or not a doctor's name was actually given.
function displayLabel(appt){
  if(appt.doctorName) return `Dr. ${appt.doctorName}`;
  if(appt.specialty) return `${appt.specialty} appointment`;
  return 'Appointment';
}

// One motion: hold, talk, let go — it's saved. A brief toast with Undo is the only safety net.
async function autoSave(parsed, rawText){
  const todayStr = new Date().toISOString().slice(0,10);
  const appt = {
    id: Date.now().toString(),
    doctorName: (parsed.doctorName || '').trim(),
    specialty: parsed.specialty || '',
    date: parsed.date || '',
    time: parsed.time || '',
    location: parsed.location || '',
    verified: !!parsed.verified,
    verifyNote: parsed.verifyNote || '',
    rawText
  };
  const isPast = appt.date && appt.date < todayStr;

  appointments.push(appt);
  await saveAppointments();
  chimeSuccess();
  render();
  hint.textContent = '';
  speakConfirmation(appt, isPast);
  showUndoToast(appt, isPast);
}

let toastTimer = null;
function showUndoToast(appt, isPast){
  clearTimeout(toastTimer);
  const label = displayLabel(appt);
  const when = `${formatDatePretty(appt.date)}${appt.time ? ' · ' + appt.time : ''}`;
  toast.innerHTML = `
    <div class="toast-text">
      <div class="toast-title">${isPast ? '⚠ Saved — but that date already passed' : '✓ Saved'}</div>
      <div class="toast-sub">${escapeHtml(label)} · ${escapeHtml(when)}</div>
    </div>
    <button id="toastUndo">Undo</button>
  `;
  toast.classList.add('show');
  document.getElementById('toastUndo').addEventListener('click', async ()=>{
    appointments = appointments.filter(a => a.id !== appt.id);
    await saveAppointments();
    render();
    toast.classList.remove('show');
    clearTimeout(toastTimer);
  });
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 5000);
}

// Reads the confirmation back out loud so mom doesn't have to read the screen to know it worked.
function speakConfirmation(appt, isPast){
  if(!window.speechSynthesis) return;
  try{
    window.speechSynthesis.cancel();
    const parts = [];
    parts.push(displayLabel(appt) + '.');
    if(isPast) parts.push("Heads up, that date already passed, please check it.");
    else{
      parts.push(appt.date ? formatDatePretty(appt.date) + '.' : "I didn't catch a date.");
      if(appt.time) parts.push('At ' + appt.time + '.');
    }
    const u = new SpeechSynthesisUtterance(parts.join(' '));
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- List rendering + hidden triple-tap delete ----------
const tapState = {};
function render(){
  appointments.sort((a,b) => (a.date || '9999').localeCompare(b.date || '9999'));
  listEl.innerHTML = '';
  emptyMsg.style.display = appointments.length ? 'none' : 'block';
  appointments.forEach(appt => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = appt.id;
    card.innerHTML = `
      <div>
        <div class="card-doc">${escapeHtml(displayLabel(appt))}</div>
        <div class="card-sub">${escapeHtml(appt.doctorName ? (appt.specialty || appt.location || '') : (appt.location || ''))}</div>
      </div>
      <div class="card-when">
        <div class="card-date">${formatDatePretty(appt.date)}</div>
        <div class="card-time">${escapeHtml(appt.time || '')}</div>
      </div>
    `;
    card.addEventListener('click', () => handleCardTap(appt.id, card));
    listEl.appendChild(card);
  });
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function handleCardTap(id, card){
  if(!tapState[id]) tapState[id] = { count: 0, timer: null };
  const state = tapState[id];
  state.count++;
  clearTimeout(state.timer);

  card.classList.remove('tap1','tap2');
  if(state.count === 1){ card.classList.add('tap1'); }
  else if(state.count === 2){ card.classList.add('tap2'); }
  else if(state.count >= 3){
    card.classList.add('gone');
    chimePoof();
    setTimeout(async ()=>{
      appointments = appointments.filter(a => a.id !== id);
      delete tapState[id];
      await saveAppointments();
      render();
    }, 340);
    return;
  }
  state.timer = setTimeout(()=>{ state.count = 0; card.classList.remove('tap1','tap2'); }, 1200);
}

// ---------- Init ----------
loadAppointments();
</script>
